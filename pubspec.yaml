name: afzal_opportunities
description: >-
  Afzal Opportunities — a modern advertisement-discovery Android app
  by Afzal E Services. Browse jobs, scholarships, admissions and more.
publish_to: "none"
version: 1.2.0+3

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.15.2
  cloud_firestore: ^5.6.12
  firebase_auth: ^5.5.4
  firebase_storage: ^12.4.10
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  flutter_svg: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/logo/afzal_e_services_logo.png
    - assets/logo/a_mark.svg
    - assets/icon/app_icon.png
